experiment_name: unified_lstm_finetune
# Unified benchmark: LSTM backbone, fine-tuning transfer.
# Same split / features / seed as all other unified experiments.
random_seed: 42
device: auto

dataset:
  source:
    name: panasonic_18650pf
    domain_id: panasonic_18650pf
  target:
    name: lg_hg2
    domain_id: lg_hg2

split:
  strategy: by_cycle
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

preprocessing:
  feature_cols: [voltage, current, temperature]
  normalize: true
  normalizer: minmax

sequence:
  mode: fixed_non_overlapping
  seq_len: 50

model:
  name: lstm
  input_size: 3
  hidden_size: 64
  num_layers: 2
  dropout: 0.1
  output_clip: true

transfer:
  method: finetune
  finetune_lr_scale: 0.1

optimizer:
  name: adam
  lr: 0.001

scheduler:
  name: plateau
  patience: 10
  factor: 0.5

epochs: 100
batch_size: 32

label_availability:
  source_labels: true
  target_labels: true

output_path: outputs/unified_lstm_finetune
resume: false
