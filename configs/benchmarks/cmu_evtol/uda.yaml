experiment_name: cmu_evtol_uda
# Unsupervised domain adaptation from Panasonic to CMU eVTOL.
# Target SOC labels are NOT available during training or adaptation.
# NOT YET IMPLEMENTED.
random_seed: 42
device: auto

dataset:
  source:
    name: panasonic_18650pf
    domain_id: panasonic_18650pf
  target:
    name: cmu_evtol
    domain_id: cmu_evtol

split:
  strategy: by_mission   # CMU eVTOL uses mission-level splits

preprocessing:
  feature_cols: [voltage, current, temperature]
  normalize: true
  normalizer: minmax

sequence:
  mode: mission_phase   # respect mission phase boundaries

model:
  name: lstm
  input_size: 3
  hidden_size: 64
  num_layers: 2
  output_clip: true

transfer:
  method: source_only   # baseline until UDA methods are implemented

optimizer:
  name: adam
  lr: 0.001

epochs: 100
batch_size: 32

label_availability:
  source_labels: true
  target_labels: false   # eVTOL SOC labels unavailable

output_path: outputs/benchmarks/cmu_evtol/uda
resume: false
