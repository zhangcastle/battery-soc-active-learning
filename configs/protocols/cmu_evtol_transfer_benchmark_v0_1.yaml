protocol_name: cmu_evtol_transfer_benchmark
protocol_version: "0.1"
status: protocol_only

source_domain:
  dataset: panasonic_18650pf
  cell_model: NCR18650PF
  main_temperature_c: 25

target_domain:
  dataset: cmu_evtol_vtc6
  cell_model: Sony-Murata 18650 VTC6
  raw_root: data/raw/cmu_evtol_vtc6/figshare_14226830
  cell_protocol_manifest: data/manifests/cmu_evtol_vtc6_cell_protocols.csv
  soc_reference_status: not_defined_in_v0_1

primary_benchmark:
  population: baseline_protocol_cells
  cell_selection:
    manifest_filter:
      protocol_group: baseline
      is_baseline: true
  evaluation_strategy: leave_one_cell_out
  split_unit: complete_mission
  row_level_random_split: false
  window_level_random_split_before_mission_assignment: false
  same_mission_must_remain_in_one_split: true

folds:
  - fold_id: test_vah01
    adaptation_cells: [VAH17, VAH27]
    test_cells: [VAH01]
  - fold_id: test_vah17
    adaptation_cells: [VAH01, VAH27]
    test_cells: [VAH17]
  - fold_id: test_vah27
    adaptation_cells: [VAH01, VAH17]
    test_cells: [VAH27]

condition_stress_tests:
  enabled_in_primary_benchmark: false
  source: cell_protocol_manifest
  groups:
    - discharge_power_shift
    - cruise_duration_shift
    - charge_current_shift
    - thermal_or_cooling_shift
    - end_of_charge_voltage_shift
    - other_or_uncertain

target_label_budgets:
  unit: percent_of_eligible_complete_missions
  values_percent: [1, 5, 10]
  selection: chronological_prefix_per_adaptation_cell
  cell_order: lexical_cell_id
  rounding: ceil
  nested_subsets_required: true
  same_manifest_for_transfer_and_scratch: true
  record_realized_mission_count: true
  record_realized_sample_count: true
  record_realized_duration: true

tracks:
  zero_shot:
    source_labels: true
    target_adaptation_inputs: false
    target_adaptation_labels: false
  unsupervised_adaptation:
    source_labels: true
    target_adaptation_inputs: true
    target_adaptation_labels: false
  supervised_few_shot:
    source_pretraining: true
    target_adaptation_inputs: true
    target_adaptation_labels: true
    budgets_percent: [1, 5, 10]
  same_budget_scratch:
    source_pretraining: false
    target_adaptation_inputs: true
    target_adaptation_labels: true
    reuse_few_shot_budget_manifest: true
  full_target_upper_bound:
    source_pretraining: model_specific
    target_adaptation_inputs: true
    target_adaptation_labels: true
    target_label_scope: all_eligible_adaptation_missions

test_isolation:
  test_cells_allowed_in_adaptation: false
  test_cells_allowed_in_scaler_fit: false
  test_cells_allowed_in_hyperparameter_tuning: false
  test_cells_allowed_in_early_stopping: false
  test_cells_allowed_in_model_selection: false

deferred:
  mission_ids: not_defined_in_v0_1
  mission_reconstruction: not_defined_in_v0_1
  soc_reference_version: not_defined_in_v0_1
  rpt_and_capacity_policy: not_defined_in_v0_1
  resampling_interval: not_defined_in_v0_1
  physical_context_length: not_defined_in_v0_1
  aging_stage_boundaries: not_defined_in_v0_1
