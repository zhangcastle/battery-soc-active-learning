protocol_version: cmu_evtol_rpt_capacity_v1
detector_version: cmu_evtol_rpt_detector_v1
dataset_version: "3"
cells: [VAH01, VAH17, VAH27]

broad_discovery:
  discharge_power_W: [0.2, 8.0]
  fragment_min_duration_s: 900.0
  minimum_discharge_fraction: 0.7
  maximum_intervening_runs: 1

acceptance:
  full_charge_voltage_V: 4.15
  start_voltage_min_V: 4.10
  cutoff_voltage_max_V: 2.55
  exact_ns_sequence: [3, 4, 5, 6, 7]
  discharge_ns_values: [3, 5, 7]
  interruption_ns_values: [4, 6]
  interruption_count: 2
  interruption_max_duration_s: 120.0
  interruption_max_abs_current_A: 0.15
  file_tail_rest_max_abs_current_A: 0.10
  near_c5_current_A: [-0.75, -0.45]
  near_c5_minimum_row_fraction: 0.70
  charge_contamination_maximum_row_fraction: 0.02
  charge_contamination_reject_row_fraction: 0.20
  capacity_physical_range_Ah: [2.30, 3.40]
  minimum_rejected_capacity_Ah: 1.00
  minimum_candidate_duration_s: 3600.0

capacity_qc:
  initial_capacity_expected_range_Ah: [2.70, 3.30]
  small_rebound_warning_Ah: 0.0
  adjacent_change_review_fraction: 0.10
  net_vs_discharge_only_warning_Ah: 0.01
  independent_vs_qdischarge_warning_Ah: 0.02
  expected_internal_mission_spacing: 50

status_precedence: [rejected, review_required, accepted]
reason_order:
  rejected:
    - crosses_continuous_block
    - non_finite_time
    - time_not_strictly_increasing
    - non_finite_current
    - zero_or_negative_duration
    - insufficient_discharge_capacity
    - severe_charge_contamination
  review_required:
    - missing_preceding_full_charge
    - missing_preceding_rest
    - start_voltage_below_full_region
    - unexpected_ns_sequence
    - interruption_count_mismatch
    - not_predominantly_near_c5
    - charge_contamination_above_limit
    - cutoff_not_reached
    - capacity_outside_physical_range
    - initial_capacity_outside_expected_range
    - adjacent_capacity_jump
  warnings:
    - file_tail_without_following_charge
    - qdischarge_counter_reset
    - net_vs_discharge_only_mismatch
    - independent_vs_qdischarge_mismatch
    - small_capacity_rebound
    - mission_spacing_not_50

integration:
  method: trapezoidal
  current_sign: positive_charge_negative_discharge
  capacity_net_definition: -integral(I_A_dt)/3600
  capacity_discharge_only_definition: integral(max(-I_A,0)_dt)/3600

capacity_lookup_authorized: false
dynamic_soc_authorized: false
