protocol_name: cmu_evtol_transfer_benchmark
protocol_version: "0.1"
status: development_protocol

source_domain:
  dataset: panasonic_18650pf
  cell_model: NCR18650PF
  main_temperature_c: 25

target_domain:
  dataset: cmu_evtol_vtc6
  cell_model: Sony-Murata 18650 VTC6
  raw_root: data/raw/cmu_evtol_vtc6/figshare_14226830
  cell_protocol_manifest: data/manifests/cmu_evtol/cmu_evtol_vtc6_cell_protocols.csv
  soc_reference_status: not_defined_in_v0_1

primary_benchmark:
  population: core7_independent_target_cells
  evaluation_strategy: per_cell_supervised_adaptation
  split_unit: complete_mission
  row_level_random_split: false
  window_level_random_split_before_mission_assignment: false
  same_mission_must_remain_in_one_split: true

development_supervised_benchmark:
  target_cells: [VAH01, VAH17, VAH27, VAH30, VAH15, VAH12, VAH11]
  split_order: mission_start_source_row_then_mission_cycle_id
  split_percent: {train: 60, validation: 20, test: 20}
  split_rounding: {train: floor, validation: floor, test: remainder}
  same_test_missions_for_all_tracks: true
  manifest_path: data/manifests/cmu_evtol/cmu_evtol_supervised_budget_manifest_v0_1.csv
  status: development_only
  label_column: soc_dynamic
  label_is_ground_truth: false
  formal_benchmark_eligible: false

condition_stress_tests:
  included_as_independent_targets: true
  pooled_with_baseline_cells: false
  source: cell_protocol_manifest
  groups:
    - discharge_power_shift
    - cruise_duration_shift
    - charge_current_shift
    - thermal_or_cooling_shift
    - end_of_charge_voltage_shift
    - other_or_uncertain

target_label_budgets:
  unit: percent_of_train_complete_missions_per_target_cell
  values_percent_of_train: [1, 5, 10]
  vidal_partial_percent_of_train: 40
  vidal_full_percent_of_train: 100
  selection: chronological_prefix_per_target_cell
  rounding: ceil
  rounding_scope: per_target_cell
  nested_subsets_required: true
  same_budget_manifest_for_all_models: true
  same_split_manifest_for_all_tracks: true
  record_realized_mission_count: true
  record_realized_sample_count: true
  record_realized_duration: true

tracks:
  zero_shot:
    source_labels: true
    target_adaptation_inputs: false
    target_adaptation_labels: false
  unsupervised_adaptation:
    source_labels: true
    target_adaptation_inputs: true
    target_adaptation_labels: false
  supervised_few_shot:
    source_pretraining: true
    target_adaptation_inputs: true
    target_adaptation_labels: true
    budgets_percent: [1, 5, 10]
  same_budget_scratch:
    source_pretraining: false
    target_adaptation_inputs: true
    target_adaptation_labels: true
    reuse_few_shot_budget_manifest: true
  full_target_upper_bound:
    source_pretraining: model_specific
    target_adaptation_inputs: true
    target_adaptation_labels: true
    target_label_scope: all_eligible_adaptation_missions

test_isolation:
  test_missions_allowed_in_adaptation: false
  test_missions_allowed_in_scaler_fit: false
  test_missions_allowed_in_hyperparameter_tuning: false
  test_missions_allowed_in_early_stopping: false
  test_missions_allowed_in_model_selection: false

deferred:
  formal_mission_ids: not_defined
  formal_mission_reconstruction: not_defined
  formal_soc_reference: not_defined
  phase_name_mapping: not_defined
  aging_stage_boundaries: not_defined_in_v0_1
