protocol_name: cmu_evtol_mission_segmentation
protocol_version: "0.1"
segmentation_schema_version: cmu_evtol_mission_v0_1
status: draft
production_enabled: false
emit_mission_records: false
emit_phase_labels: false
emit_rpt_labels: false
implementation_authorized: false

dataset:
  article_id: "14226830"
  dataset_version: "3"
  raw_loader_schema_version: cmu_evtol_kilthub_v3_raw_v0.1
  exploratory_gap_threshold_s: 120.0

references:
  raw_ingestion_protocol: docs/datasets/cmu_evtol/protocols/cmu_evtol_raw_ingestion_v0_1.md
  cell_protocol_manifest: data/manifests/cmu_evtol/cmu_evtol_vtc6_cell_protocols.csv
  asset_inventory: data/manifests/cmu_evtol/cmu_evtol_vtc6_asset_inventory_v3.csv
  raw_qc: data/manifests/cmu_evtol/cmu_evtol_vtc6_raw_qc_v3_120s.csv
  evidence_audit: data/manifests/cmu_evtol/cmu_evtol_mission_phase_evidence_v0_1.csv
  evidence_audit_sha256: 3245f58d90f3f0bea0761652c22e93fd2128d3de84be97238f2899e2ec0e0613

metadata:
  generation_git_revision: 7fd9fbe380dac390dabe6404960d690fb228e8dc
  power_formula: electrical_power_W = Ecell_V * I_mA / 1000
  candidate_threshold_source: descriptive_phase_evidence_audit_only
  production_enablement_requirement: new_reviewed_protocol_version_and_validated_implementation
  changing_production_enabled_alone_is_sufficient: false

evidence_cells:
  baseline: [VAH01, VAH17, VAH27]
  condition: [VAH02, VAH12, VAH05]
  supported: [VAH01, VAH17, VAH27, VAH02, VAH12, VAH05]
  deferred_unvalidated:
    [VAH06, VAH07, VAH09, VAH10, VAH11, VAH13, VAH15, VAH16,
     VAH20, VAH22, VAH23, VAH24, VAH25, VAH26, VAH28, VAH30]

input_schema:
  - cell_id
  - source_file
  - source_row
  - time_s
  - Ecell_V
  - I_mA
  - cycleNumber
  - Ns
  - continuous_block_id
  - continuous_block_boundary_reason

permitted_evidence:
  - canonical_continuous_block_id
  - source_row_order
  - time_s
  - Ns_transitions
  - signed_current_and_power
  - real_segment_duration
  - completeness_checks
  - cell_condition_metadata

cycle_number_policy:
  preserve_as_raw_observation: true
  allowed_as_mission_primary_key: false
  allowed_as_mission_boundary: false
  allowed_as_split_key: false
  considered_globally_unique: false

candidate_structure:
  ordered_segments: [high_discharge_run, lower_discharge_run, high_discharge_run]
  ns_4_5_6_role: auxiliary_transition_evidence_only
  ns_alone_can_determine_phase: false

candidate_enumeration:
  scope: one_continuous_block_at_a_time
  run_unit: contiguous_same_Ns_rows_within_one_continuous_block
  order: ascending_source_row
  anchor: run_with_high_discharge_power_evidence
  lookahead: next_two_adjacent_runs_must_form_lower_then_high
  crossing_continuous_block_allowed: false
  missing_followup_action: emit_uncertain_qc_candidate
  ns_4_role: auxiliary_anchor_evidence_only
  ns_4_alone_can_accept: false
  overlap_policy: disallow_shared_runs
  overlap_resolution: earliest_anchor_source_row_wins
  overlap_loser_action: emit_uncertain_with_overlaps_earlier_candidate

classification:
  primary_statuses: [out_of_scope, hard_reject, uncertain, accept]
  precedence: [out_of_scope, hard_reject, uncertain, accept]
  exactly_one_primary_status_per_candidate: true
  primary_reason_selection: first_triggered_reason_in_listed_reason_code_order_of_winning_status
  retain_all_triggered_reason_codes: true
  duplicate_reason_codes_allowed: false
  reason_codes:
    out_of_scope:
      - deferred_cell_without_phase_evidence_validation
      - unsupported_schema_or_dataset_version
      - unknown_cell_condition
    hard_reject:
      - crosses_continuous_block
      - timestamp_nonfinite_duplicate_or_reversed
      - segment_duration_zero_or_negative
      - severe_charge_or_rest_contamination
      - clearly_matches_long_low_rate_diagnostic_evidence
      - segment_order_definitively_incorrect
      - spans_explicit_gap_boundary
    uncertain:
      - missing_required_segment
      - interrupted_or_partial_waveform
      - early_end_of_life_cutoff
      - near_block_or_file_boundary_without_crossing
      - power_or_duration_near_but_not_within_screening_range
      - mission_vs_diagnostic_not_reliably_distinguishable
      - overlaps_earlier_candidate
    accept:
      - all_accept_requirements_met
  accept_requirements:
    - all_three_segments_in_same_continuous_block
    - source_rows_strictly_increasing
    - timestamps_strictly_increasing
    - all_segment_durations_finite_and_positive
    - all_segments_discharge_dominated
    - ordered_high_lower_high_power_shape
    - power_and_duration_consistent_with_cell_condition_evidence
    - no_canonical_discontinuity_inside_candidate
    - does_not_match_rpt_like_low_rate_evidence
  silent_drop_allowed: false
  rpt_like_action: exclude_from_ordinary_mission_candidates_without_emitting_rpt_label

diagnostic_screening_thresholds:
  status: v0_1_diagnostic_candidate_screening_only
  source: data/manifests/cmu_evtol/cmu_evtol_mission_phase_evidence_v0_1.csv
  high_discharge_power_W: [35.0, 70.0]
  lower_discharge_power_W: [5.0, 30.0]
  first_high_duration_s: [45.0, 120.0]
  lower_duration_s: [200.0, 1500.0]
  last_high_duration_s: [60.0, 150.0]
  minimum_discharge_fraction: 0.9
  rpt_like_discharge_power_W: [0.5, 4.0]
  rpt_like_minimum_duration_s: 3600.0
  rpt_like_minimum_voltage_drop_V: 0.8
  rpt_like_maximum_end_voltage_V: 2.7
  condition_specific_final_acceptance_tolerance: not_frozen
  maximum_next_implementation_scope: diagnostic_classifier_only

proposed_mission_id:
  template: "cmu_v3_mission_v0_1:{cell_id}:b{continuous_block_id}:s{start_row}:e{end_row}"
  contains_cycle_number: false
  emitted_in_v0_1: false

proposed_output_schema:
  - segmentation_schema_version
  - cell_id
  - mission_id
  - continuous_block_id
  - mission_source_row_start
  - mission_source_row_end
  - mission_time_start_s
  - mission_time_end_s
  - primary_status
  - primary_reason
  - all_reason_codes
  - completeness_status
  - exclusion_reason
  - protocol_condition
  - takeoff_source_row_start
  - takeoff_source_row_end
  - cruise_source_row_start
  - cruise_source_row_end
  - landing_source_row_start
  - landing_source_row_end
  - takeoff_duration_s
  - cruise_duration_s
  - landing_duration_s
  - takeoff_power_median_W
  - cruise_power_median_W
  - landing_power_median_W
  - qc_flags

deferred:
  production_segmentation_implementation: not_implemented
  complete_rpt_identification: not_defined
  capacity_lookup: not_defined
  soc_reference: not_defined
  dataset_splits: not_defined
  sequence_windows: not_defined
  condition_specific_final_acceptance_tolerances: not_frozen
